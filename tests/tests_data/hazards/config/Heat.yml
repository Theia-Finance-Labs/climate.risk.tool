indicators:
  hi:
    file: hi.nc
    variable: hi
    index: [gwl, return_period]
    fixed: { ensemble: mean }
    agg: closest

mappings:
  cnae_exposure:
    file: cnae_labor_productivity_exposure.csv
    join:
      on_assets: [cnae]
  exposure_links:
    file: exposure_factors.csv
    join:
      on_hazard: [gwl]
      on_assets: [state, lp_exposure]
      on_intensity: []


