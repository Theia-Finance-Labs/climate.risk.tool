indicators:
  hi:
    file: hi.nc
    variable: hi
    index: [gwl, return_period]
    fixed: { ensemble: mean }
    agg: closest

mappings:
  cnae_exposure:
    file: cnae_labor_productivity_exposure.csv
    variables: [lp_exposure]
    join:
      on_assets: [cnae]
  exposure_links:
    file: exposure_factors.csv
    variables: [damage_factor]
    join:
      on_indicator_index: [gwl]
      on_assets: [state, lp_exposure]
      on_indicator_intensity: []

shocks:
  revenue:
    equations:
      - name: heat_labor_productivity
        equation: |
          {
            weighted_lp_loss <- (hi / 365) * damage_factor
            L_adjusted <- L0 * (1 + weighted_lp_loss)
            Y_base <- exp(lnA + B1 * log(K0) + B2 * log(L0) + B3 * log(E0))
            Y_shock <- exp(lnA + B1 * log(K0) + B2 * log(L_adjusted) + B3 * log(E0))
            change <- (Y_shock / Y_base) - 1
            pmax(0, revenue * (1 + change))
          }
        constants:
          L0: 339.2285
          K0: 87025023
          E0: 43.99034
          lnA: 2.398
          B1: 0.602
          B2: 0.455
          B3: 0.147

