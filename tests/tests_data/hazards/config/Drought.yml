indicators:
  spi3:
    file: spi3.nc
    variable: spi3
    index: [scenario_name, return_period, season]
    fixed: { ensemble: mean }
    agg: closest

mappings:
  drought_sensitivity:
    file: drought_factors.csv
    variables: [damage_factor]
    intensity_match: closest
    join:
      on_indicator_index: [scenario_name, season]
      on_assets: [asset_subtype, state]
      on_indicator_intensity: [spi3]

shocks:
  revenue:
    equations:
      - name: drought_agriculture
        when: "asset_category == 'agriculture'"
        equation: "revenue ~ revenue * (1 - damage_factor)"
