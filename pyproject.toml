[project]
name = "climate-risk-tool-python"
version = "0.1.0"
description = "Python dependencies for climate risk tool hazard preprocessing scripts"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "geopandas>=0.10.0",
    "xarray>=2021.12.0",
    "netcdf4>=1.6.0",
    "dask[distributed]>=2021.12.0",
    "shapely>=2.0.0",
    "unidecode>=1.3.0",
    "tqdm>=4.62.0",
    "bokeh>=3.1.1",
    "rasterio>=1.3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/climate_risk_tool_python"]

